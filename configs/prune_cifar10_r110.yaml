# TransGap v2 — Pruning Config for ResNet-110 / CIFAR-10

model: resnet110
dataset: cifar10

# TG Computation
num_cal_batches: 10
channel_tg_method: approx

# Block Pruning
max_block_tg: 0.05
target_flops_ratio: 0.5

# Channel Pruning
max_channel_ratio: 0.7

# Fine-tuning
ft_epochs: 300
ft_lr: 0.01
ft_weight_decay: 0.0005
ft_warmup_epochs: 5
label_smoothing: 0.1
use_mixup: true
mixup_alpha: 0.2
grad_clip: 5.0

# Knowledge Distillation
kd_alpha: 0.7
kd_temperature: 4.0

# TG-Aware LR Scaling
tg_lr_alpha: 1.0

# Paths
batch_size: 128
data_path: ./data
save_dir: ./checkpoints
